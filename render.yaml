# ================================================================================
# RENDER.YAML - Deploy Automatico do GPS Caminhoneiro Pro (backend)
# O banco (gps-truck-postgis) JA foi criado manualmente no painel do Render.
# Este blueprint cria apenas o web service e conecta no banco existente.
# Crie o banco em: https://dashboard.render.com/new/database
# ================================================================================

services:
  - type: web
    name: gps-truck-backend
    runtime: node
    plan: free
    rootDir: backend-api
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /status
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: PORT
        value: 3000
      - key: FRONTEND_URL
        value: "*"
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_VERSION
        value: "20"
      # --- Assinatura Premium via PIX (valores ficam no painel do Render) ---
      - key: PIX_KEY
        sync: false
      - key: PIX_NAME
        sync: false
      - key: PIX_CITY
        sync: false
      - key: PIX_AMOUNT
        value: "4.99"
      - key: PIX_DESCRIPTION
        sync: false
      # --- Codigo de verificacao por e-mail (SMTP/Brevo) ---
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      # --- Token administrativo (confirmacao manual do Premium) ---
      - key: ADMIN_TOKEN
        sync: false

# Passos manuais obrigatorios (2 no total):
# 1) Habilitar PostGIS no banco: Render > gps-truck-postgis > Shell > rode:
#      CREATE EXTENSION IF NOT EXISTS postgis;
#    (ou aguarde o log do deploy, que tenta isso automaticamente e avisa no log)
# 2) Atualizar o app: frontend-flutter/keys.json com
#      API_URL = https://gps-truck-backend.onrender.com
#      SOCKET_URL = https://gps-truck-backend.onrender.com
#    e rebuildar o APK.

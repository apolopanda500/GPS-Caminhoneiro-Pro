# ================================================================================
# RENDER.YAML - Deploy Automatico do GPS Caminhoneiro Pro (backend)
# O banco (gps-truck-postgis) JA foi criado manualmente no painel do Render.
# Este blueprint cria apenas o web service e conecta no banco existente.
# Crie o banco em: https://dashboard.render.com/new/database
# ================================================================================

services:
  - type: web
    name: gps-truck-backend
    runtime: node
    plan: free
    rootDir: backend-api
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /status
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: gps-truck-postgis
          property: connectionString
      - key: PORT
        value: 3000
      - key: FRONTEND_URL
        value: "*"
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_VERSION
        value: "20"

# Passos manuais obrigatorios (2 no total):
# 1) Habilitar PostGIS no banco: Render > gps-truck-postgis > Shell > rode:
#      CREATE EXTENSION IF NOT EXISTS postgis;
#    (ou aguarde o log do deploy, que tenta isso automaticamente e avisa no log)
# 2) Atualizar o app: frontend-flutter/keys.json com
#      API_URL = https://gps-truck-backend.onrender.com
#      SOCKET_URL = https://gps-truck-backend.onrender.com
#    e rebuildar o APK.

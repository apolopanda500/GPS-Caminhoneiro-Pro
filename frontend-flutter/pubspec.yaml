name: gps_camioneiro_pro
description: GPS Robusto para Caminhoneiros - Rede Veicular V2X, Chat e Alertas em Tempo Real
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  socket_io_client: ^2.0.3+1
  shared_preferences: 2.3.5
  sqflite: ^2.3.0
  path: ^1.8.3
  geolocator: ^10.1.1
  permission_handler: ^11.0.0
  http: ^1.1.0
  provider: ^6.1.1
  latlong2: ^0.9.1
  maplibre_gl: ^0.27.1
  connectivity_plus: ^7.3.2
  image_picker: ^1.2.4
  just_audio: ^0.10.6
  flutter_tts: ^4.2.5
  file_picker: ^13.1.0
  path_provider: ^2.1.6

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/map_styles/
    - assets/audio/

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.1

dependency_overrides:
  shared_preferences_android: 2.4.11
  shared_preferences_platform_interface: 2.4.2

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icons/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#0A0A0A"
  adaptive_icon_foreground: "assets/icons/app_icon_foreground.png"
